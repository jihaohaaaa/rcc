[package]
name = "rscc"
version = "0.1.0"
edition = "2024"
description = "A fast and modular C compiler written in Rust targeting AArch64"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/jihaohaaaa/rcc"
keywords = ["compiler", "c", "c99", "c11", "aarch64"]
categories = ["development-tools", "compilers"]
exclude = ["vendor/", "qjs_unity.c", "sqlite_unity.c", "sqlite3_cli_unity.c"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
codespan-reporting = "0.13"
tempfile = "3.17"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.17"
